fungsi ensureStatus(id,pageId){
    let el=document.getElementById(id);
    jika (el) kembalikan el;
    const page = document.getElementById(pageId);
    jika (!halaman) kembalikan null;
    el=document.createElement("p");
    el.id=id;
    el.className="no-print";
    el.style.margin="14px 0 0";
    el.style.fontWeight="600";
    el.style.color="var(--muted,#6b7785)";
    const card = page.querySelector(".book-header");
    jika (kartu) kartu.appendChild(el);
    jika tidak, tambahkan anak (elemen);
    kembalikan el;
}

fungsi ensureStatus(){
    sureStatus("statusEkspedisi","ekspedisiPage");
    pastikanStatus("statusTunai","tunaPage");
    ensureStatus("statusData","rekapPage");
}

window.tampilTersimpan=function(pesan="âœ“ Tersimpan"){
    const el = document.getElementById("savePopup");
    jika (!el) kembali;
    el.textContent=String(pesan)
        .replace(/é‰ ï¿½/g,"âœ“")
        .replace(/éˆ«ï¿½/g,"â†'")
        .replace(/è„³/g,"Ã—")
        .replace(/é”›ï¿½/g,"+")
        .replace(/éˆï¿½/g,"âˆ'");
    el.classList.add("show");
    clearTimeout(window.savePopupTimer);
    window.savePopupTimer=setTimeout(
        ()=>el.classList.remove("show"),1800
    );
};

window.buatBarisPengeluaran=function(tbody,key,index,keterangan,jumlah){
    const row = document.createElement("div");
    baris.className="exp-expense-row";
    baris.indeks dataset=indeks;

    const p=key.split("-");
    const tahun=Number(p[0]);
    const bulan = Number(p[1]);
    const hari=Number(p[2]);

    baris.innerHTML=`
        <input type="text"
          id="exp-ket-${key}-${index}"
          value="${escapeHtml(keterangan||"")}"
          placeholder="Keterangan pengeluaran"
          oninput="hitungEkspedisi();v3MarkLast('ekspedisi',${tahun},${bulan},${hari})">

        <input type="text"
          inputmode="numerik"
          id="exp-jml-${key}-${index}"
          value="${jumlah?angka(jumlah):""}"
          placeholder="0"
          oninput="formatInputEkspedisi(this)">

        <button type="button"
          kelas="exp-delete no-print"
          aria-label="Hapus pengeluaran"
          judul="Hapus pengeluaran"
          onclick="hapusPengeluaran('${key}',${index})">Ã—</button>
    `;
    tbody.appendChild(row);
};

window.buatBarisDllTunai=function(list,keyBase,resortIndex,dllIndex,keterangan,jumlah){
    const row = document.createElement("div");
    baris.className="tunai-dll-row";
    baris.indeks dataset=indeks dll;

    baris.innerHTML=`
        <input type="text"
          id="tunai-dll-ket-${keyBase}-${resortIndex}-${dllIndex}"
          value="${escapeHtml(keterangan||"")}"

        <input type="text"
          inputmode="numerik"

          value="${jumlah?angka(jumlah):""}"
          placeholder="0"
          oninput="formatInputTunai(this)">

        <button type="button"
          class="tunai-delete no-print"
          aria-label="DLL Hapus"
          judul="DLL Hapus"
          onclick="hapusDllTunai('${keyBase}',${resortIndex},${dllIndex})">Ã—</button>
    `;
    list.appendChild(row);
};

window.simpanEkspedisi=fungsi(){
    ensureStatus();

    const bulan=parseInt(document.getElementById("ekspedisiBulan").value);
    const tahun=parseInt(document.getElementById("ekspedisiTahun").value);
    const tanggal=v3DateList("ekspedisi",tahun,bulan);

    konstanta data={
        bulan,
        tahun,
        tanggalAktif:tanggal,
        saldoKasAwal:ambilSaldoKasAwalEkspedisi(bulan,tahun),
        hari:{}
    };

    tanggal.forEach(hari=>{
        const key=`${tahun}-${bulan}-${hari}`;
        const pengeluaran=[];

        dokumen.querySelectorAll(
            `#exp-body-${key} .exp-expense-row`
        ).forEach((row,index)=>{
            const ket = document.getElementById(`exp-ket-${key}-${index}`);
            const jml=document.getElementById(`exp-jml-${key}-${index}`);

            if(ket&&jml&&(ket.value.trim()!==""||parseAngka(jml.value)!==0)){
                pengeluaran.push({
                    keterangan:ke.nilai,
                    jumlah:parseAngka(jml.value)
                });
            }
        });

        data.hari[hari]={pengluaran};
    });

    misalkan saldo=data.saldoKasAwal;

    tanggal.forEach(hari=>{
        const total=(data.hari[hari].pengeluaran||[])
            .reduce((s,x)=>s+parseAngka(x.jumlah),0);

        saldo =
            saldo +
            ambilKasMasukRekap(hari,bulan,tahun) -
            total -
            ambilTunaiPasarRekap(hari,bulan,tahun);
    });

    data.saldoKasAkhir=saldo;

    mencoba{
        v3Save("ekspedisi",tahun,bulan,data);

        const last=dates[dates.length-1];
        if(last)v3MarkLast("ekspedisi",tahun,bulan,last);

        hitungEkspedisi();

        const status = document.getElementById("statusEkspedisi");
        jika(status){
            status.textContent=`Data ${namaBulan[bulan]} ${tahun} berhasil disimpan.`;
            status.className="status-sukses";
        }

        tampilTersimpan("âœ" Tersimpan");
    }catch(error){
        konsol.error(error);

        const status = document.getElementById("statusEkspedisi");
        jika(status){
            status.textContent="Gagal menyimpan data.";
            status.className="status-error";
        }

        tampilTersimpan("âœ• Gagal menyimpan");
    }
};

window.simpanTunai=fungsi(){
    ensureStatus();

    const bulan=parseInt(document.getElementById("tunaiBulan").value);
    const tahun=parseInt(document.getElementById("tunaTahun").value);
    const tanggal=v3DateList("tuna",tahun,bulan);

    konstanta data={
        bulan,
        tahun,
        tanggalAktif:tanggal,
        hari:{}
    };

    tanggal.forEach(hari=>{
        const keyBase=`${tahun}-${bulan}-${hari}`;
        data.hari[hari]=[];

        resortNames.forEach((nama,index)=>{
            const kasbon=parseAngka(
                dokumen.getElementById(
                    `tuna-kasbon-${keyBase}-${index}`
                )?.nilai
            );

            const transport=parseAngka(
                dokumen.getElementById(
                    `tuna-transportasi-${keyBase}-${index}`
                )?.nilai
            );

            const dll=[];

            dokumen.querySelectorAll(
                `#daftar-dll-tunai-${keyBase}-${index} .tunai-dll-row`
            ).forEach((row,dllIndex)=>{
                const ket = document.getElementById(
                    `tuna-dll-ket-${keyBase}-${index}-${dllIndex}`
                );
                const jml=document.getElementById(
                    `tunai-dll-jml-${keyBase}-${index}-${dllIndex}`
                );

                if(ket&&jml&&(ket.value.trim()!==""||parseAngka(jml.value)!==0)){
                    dll.push({
                        keterangan:ke.nilai,
                        jumlah:parseAngka(jml.value)
                    });
                }
            });

            data.hari[hari].push({kasbon,transport,dll});
        });
    });

    mencoba{
        v3Save("tuna",tahun,bulan,data);

        const last=dates[dates.length-1];
        if(last)v3MarkLast("tuna",tahun,bulan,last);

        hitungTunai();

        const status = document.getElementById("statusTunai");
        jika(status){
            status.textContent=`Data ${namaBulan[bulan]} ${tahun} berhasil disimpan.`;
            status.className="status-sukses";
        }

        tampilTersimpan("âœ" Tersimpan");
    }catch(error){
        konsol.error(error);

        const status = document.getElementById("statusTunai");
        jika(status){
            status.textContent="Gagal menyimpan data.";
            status.className="status-error";
        }

        tampilTersimpan("âœ• Gagal menyimpan");
    }
};
